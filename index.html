<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>선물 던지기 대작전 3D</title>
<style>
  :root { --panel: rgba(6,10,31,0.62); --text: #fff; --muted: #b0bec5; --red: #ff6b6b; --green: #81c784; --gold: #ffd740; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1030; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--text); }
  canvas { display: block; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .side { position: absolute; top: 14px; background: var(--panel); border-radius: 14px; padding: 10px 14px; min-width: 190px; }
  .side.left { left: 14px; } .side.right { right: 14px; text-align: right; }
  .name { font-weight: 800; font-size: 15px; }
  .left .name { color: var(--red); } .right .name { color: var(--green); }
  .hearts { font-size: 22px; letter-spacing: 2px; line-height: 1.3; }
  .hearts .off { opacity: .2; }
  .wins { color: var(--gold); font-size: 16px; }
  .wins .off { opacity: .2; }
  .info { font-size: 12px; color: #b9f6ca; min-height: 14px; font-weight: 600; }
  #center { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: var(--panel); border-radius: 14px; padding: 6px 18px; text-align: center; }
  #round { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  #timer { font-size: 26px; font-weight: 800; }
  #timer.low { color: var(--red); }
  #charge { position: absolute; left: 50%; bottom: 34px; width: 220px; height: 12px; transform: translateX(-50%); background: rgba(0,0,0,.45); border-radius: 8px; overflow: hidden; }
  #chargeFill { height: 100%; width: 0; background: #69f0ae; }
  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; color: var(--gold); text-shadow: 0 4px 0 rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; }
  #sub { position: fixed; left: 50%; top: calc(38% + 58px); transform: translateX(-50%); font-size: 24px; font-weight: 800; text-shadow: 0 3px 0 rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; }
  .pop { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.5); pointer-events: none; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .card { pointer-events: auto; background: rgba(6,10,31,0.78); border-radius: 20px; padding: 26px 30px; text-align: center; max-width: min(460px, calc(100vw - 32px)); box-sizing: border-box; backdrop-filter: blur(4px); }
  .card h1 { margin: 0 0 6px; font-size: 32px; }
  .card p { margin: 4px 0 16px; color: #e3f2fd; }
  .btn { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 800; color: #fff; background: #d32f2f; cursor: pointer; }
  .btn:hover { filter: brightness(1.15); }
  .help { font-size: 13px; color: var(--muted); line-height: 1.7; margin-top: 12px; }
  .help b { color: #fff; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #stick { position: absolute; left: 28px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.45); }
  .tbtn { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.15); color: #fff; font: inherit; font-weight: 800; pointer-events: auto; }
  .tbtn.on { background: rgba(255,255,255,.4); }
  #tThrow { right: 28px; bottom: 36px; width: 96px; height: 96px; font-size: 16px; }
  #tJump { right: 140px; bottom: 30px; width: 70px; height: 70px; font-size: 14px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted); }
  @media (max-width: 640px) {
    .side { min-width: 0; padding: 6px 10px; } .hearts { font-size: 16px; } #msg { font-size: 44px; }
  }
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>

<div id="hud" class="hidden">
  <div class="side left" id="p0"><div class="name"></div><div class="hearts"></div><div class="wins"></div><div class="info"></div></div>
  <div class="side right" id="p1"><div class="name"></div><div class="hearts"></div><div class="wins"></div><div class="info"></div></div>

</div>
<div id="msg"></div><div id="sub"></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>🎁 선물 던지기 대작전 3D</h1>
    <p>산타 vs 엘프, 눈 덮인 광장에서 벌이는 선물 싸움!</p>
    <button class="btn" data-mode="easy">1. CPU 대전 · 쉬움</button>
    <button class="btn" data-mode="normal">2. CPU 대전 · 보통</button>
    <button class="btn" data-mode="hard">3. CPU 대전 · 어려움</button>
    <div class="help">
      <b>마우스 좌우</b> 시점·방향 · <b>마우스 앞뒤</b> 낙하 지점 거리<br>
      <b>클릭 / J</b> 링 위치로 던지기 · <b>WASD</b> 이동 · <b>스페이스</b> 점프<br>
      키보드 조준: <b>Q/E</b> 회전 · <b>R/F</b> 멀리/가까이<br>
      <b>P</b> 일시정지 · <b>M</b> 음소거 · <b>Esc</b> 마우스 풀기/메뉴
    </div>
  </div>
</div>
<div id="end" class="overlay hidden">
  <div class="card">
    <h1 id="endTitle"></h1>
    <p id="endScore" style="font-size:30px;font-weight:800;margin:10px 0"></p>
    <p>메리 크리스마스! 🎄</p>
    <button class="btn" id="toMenu">메뉴로 (스페이스)</button>
  </div>
</div>
<div id="pauseOv" class="overlay hidden"><div class="card"><h1>일시정지</h1><p>클릭하면 계속 · Esc 메뉴</p></div></div>
<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>

</div>

<script type="module">

function tone(freq, dur = 0.12, type = 'square', vol = 0.06, delay = 0, slide = 0) {
  if (muted || state === 'title') return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

};

// ================= 렌더러 / 씬 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });

scene.background = new THREE.Color(SKY);

scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x3a4470, 1.1));
const moonLight = new THREE.DirectionalLight(0xd6deff, 1.4);

Object.assign(moonLight.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });

function mesh(geo, mat, parent, x = 0, y = 0, z = 0) {

  o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true;

  return o;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });

function stripeTexture(a = '#e53935', b = '#ffffff') {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = b; x.fillRect(0, 0, 64, 64); x.fillStyle = a;
  for (let i = -64; i < 128; i += 22) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 11, 0); x.lineTo(i + 11 + 64, 64); x.lineTo(i + 64, 64); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 3);
  return t;
}

  for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? r2 : r1; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  return s;
}
function heartShape() {
  const s = new THREE.Shape();
  s.moveTo(0, -0.35); s.bezierCurveTo(-0.6, 0.05, -0.3, 0.48, 0, 0.2); s.bezierCurveTo(0.3, 0.48, 0.6, 0.05, 0, -0.35);
  return s;
}

const snowMat = std(0xeef3ff, { roughness: 0.95 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), snowMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const arenaFloor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_X * 2 + 1.5, 32), std(0xf7faff, { roughness: 0.9 }));

for (let x = -ARENA_X; x <= ARENA_X + 0.01; x += 2.2) {

  const hook = mesh(new THREE.TorusGeometry(0.14, 0.07, 8, 14, Math.PI), caneMat, scene, x + 0.14, 0.8, 0);

}
// 경기장 둘레 눈 둔덕
const bankMat = std(0xe3eafa, { roughness: 1 });
for (let z = -17; z <= 17; z += 1.6) for (const s of [-1, 1]) {
  const b = mesh(new THREE.SphereGeometry(1, 12, 8), bankMat, scene, s * (ARENA_X + 1.6), 0, z);
  b.scale.set(rand(0.9, 1.3), rand(0.4, 0.65), rand(1, 1.4)); b.castShadow = false;
}

// 큰 크리스마스 트리 (엘프 진영 뒤)
const TREE_Z = -27;
const tree = new THREE.Group(); tree.position.set(0, 0, TREE_Z); scene.add(tree);
mesh(new THREE.CylinderGeometry(0.6, 0.8, 2.4, 12), std(0x5d4037), tree, 0, 1.2, 0);
const treeGreen = std(0x1f6b2a, { roughness: 0.85 }), treeSnow = std(0xf0f5ff);
const TREE_LAYERS = [];
for (let i = 0; i < 5; i++) {
  const r = 4.6 - i * 0.85, h = 3.4, y = 2.2 + i * 1.9;
  mesh(new THREE.ConeGeometry(r, h, 28), treeGreen, tree, 0, y + h / 2, 0);
  const snowRing = mesh(new THREE.ConeGeometry(r * 1.01, 0.5, 28, 1, true), treeSnow, tree, 0, y + 0.25, 0); snowRing.castShadow = false;
  TREE_LAYERS.push({ r, y, h });
}
const ornaments = [];
const ORN_COLORS = [0xff5252, 0xffd740, 0x40c4ff, 0xe040fb, 0x69f0ae, 0xffffff];
for (let i = 0; i < 70; i++) {
  const L = pick(TREE_LAYERS), f = rand(0.08, 0.85), a = rand(-Math.PI * 0.9, Math.PI * 0.9) + Math.PI / 2;
  const r = L.r * (1 - f) * 0.98;
  const c = pick(ORN_COLORS);
  const m = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 1.2, roughness: 0.3 });
  const o = mesh(new THREE.SphereGeometry(0.18, 10, 8), m, tree, Math.cos(a) * r, L.y + f * L.h, Math.sin(a) * r);
  o.castShadow = false;
  ornaments.push({ m, t: rand(0, 6) });
}
const topStar = mesh(new THREE.ExtrudeGeometry(starShape(1.1, 0.45), { depth: 0.3, bevelEnabled: false }),
  new THREE.MeshStandardMaterial({ color: 0xffeb3b, emissive: 0xffd740, emissiveIntensity: 2 }), tree, 0, 2.2 + 4 * 1.9 + 3.4 + 0.7, -0.15);
const treeLight = new THREE.PointLight(0xffc870, 120, 40, 2); treeLight.position.set(0, 9, TREE_Z + 6); scene.add(treeLight);
// 트리 아래 선물 더미 (아래에서 makeGift 정의 후 추가)

// 집들
function makeHouse(x, z, rotY) {
  const h = new THREE.Group(); h.position.set(x, 0, z); h.rotation.y = rotY; scene.add(h);
  const w = rand(5, 7), d = rand(4.5, 6), ht = rand(3, 4.5);
  mesh(new THREE.BoxGeometry(w, ht, d), std(pick([0x8d3b2f, 0x3f5e7a, 0x6d5136, 0x4e6b48, 0x7a4b6b])), h, 0, ht / 2, 0);
  const rs = new THREE.Shape(); rs.moveTo(-d / 2 - 0.4, 0); rs.lineTo(d / 2 + 0.4, 0); rs.lineTo(0, d * 0.45); rs.closePath();
  const roof = mesh(new THREE.ExtrudeGeometry(rs, { depth: w + 0.6, bevelEnabled: false }), std(0xf0f4ff), h, -(w + 0.6) / 2, ht, 0);
  roof.rotation.y = Math.PI / 2;
  const winMat = new THREE.MeshStandardMaterial({ color: 0xffd77a, emissive: 0xffc457, emissiveIntensity: 1.4 });
  for (let i = -1; i <= 1; i += 2) mesh(new THREE.PlaneGeometry(0.9, 0.9), winMat, h, i * w * 0.25, ht * 0.55, d / 2 + 0.01).castShadow = false;
  mesh(new THREE.PlaneGeometry(0.9, 1.6), std(0x3b241c), h, 0, 0.8, d / 2 + 0.01).castShadow = false;
  mesh(new THREE.BoxGeometry(0.7, 1.6, 0.7), std(0x8d3b2f), h, w * 0.25, ht + d * 0.4, 0);
}
[[-20, -44, 0.1], [-9, -48, 0], [10, -47, -0.05], [21, -43, -0.15], [-31, -30, 0.7], [31, -29, -0.7], [-33, -10, 1.3], [33, -8, -1.3]]
  .forEach(([x, z, r]) => makeHouse(x, z, r));
// 주변 작은 나무
const pineDark = std(0x16502a);
for (let i = 0; i < 40; i++) {
  const s = Math.random() < 0.5 ? -1 : 1, x = s * rand(15, 40), z = rand(-55, 20);
  if (Math.abs(x) < 16 && z > -20) continue;
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const sc = rand(0.7, 1.5);
  mesh(new THREE.ConeGeometry(1.3 * sc, 3 * sc, 10), pineDark, g, 0, 1.6 * sc, 0);
  mesh(new THREE.ConeGeometry(0.75 * sc, 1.2 * sc, 10), treeSnow, g, 0, 2.7 * sc, 0);
}

  mesh(new THREE.SphereGeometry(0.48, 16, 12), treeSnow, g, 0, 3.2, 0);

}
snowman(-15.5, -6, 0.6); snowman(15.5, 7, -0.8);

// 하늘: 별, 달
{

const SNOW_N = 1400;

// ================= 선물 / 캐릭터 모델 =================
const giftBoxGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);

function makeGift(color) {

// ================= CPU =================
const AI_CFG = {
  easy: { err: 0.1, aim: 0.12, interval: [1.5, 2.5], react: 0.5, dodge: 0.4, lead: 0 },
  normal: { err: 0.05, aim: 0.05, interval: [1.0, 1.7], react: 0.28, dodge: 0.72, lead: 0.5 },
  hard: { err: 0.022, aim: 0.02, interval: [0.6, 1.1], react: 0.14, dodge: 0.93, lead: 0.9 },
};
let ais = [];
function newAI() { return { tick: 0, tx: 0, tz: null, throwT: rand(1, 1.6), want: 0.5, aimX: 0, aimZ: 0, jumpReq: false }; }
function predictHit(g, p) {
  let { x, y, z, vx, vy, vz } = g;
  for (let t = 0; t < 1.8; t += 1 / 60) {
    vy -= G / 60; x += vx / 60; y += vy / 60; z += vz / 60;
    if (y < 0) return null;
    if (hitsChar(x, y, z, g.r, p, 0.35)) return { t, vx, vz };
  }
  return null;
}
function solveCharge(p, tx, tz, ty) {
  const d = Math.hypot(tx - p.x, tz - p.z);
  let best = 0.5, bestErr = 1e9, bestT = 1;
  for (let c = 0; c <= 1.0001; c += 0.02) {
    const v = (9 + c * 15) * (p.power && p.power.type === 'big' ? 0.93 : 1), vh = v * Math.SQRT1_2;
    let y = p.y + 2.2, vy = v * Math.SQRT1_2, t = 0;
    while (t < 4) { vy -= G / 60; y += vy / 60; t += 1 / 60; if (vy < 0 && y <= ty) break; }
    const err = Math.abs(vh * t + 0.4 - d);
    if (err < bestErr) { bestErr = err; best = c; bestT = t; }
  }
  return { c: best, t: bestT };
}
function aiInput(p, o, dt, ai, cfg) {
  const inp = { mx: 0, mz: 0, jump: false, throw: false };
  if (ai.tz == null) { ai.tx = p.x; ai.tz = p.z; }
  ai.tick -= dt; ai.throwT -= dt;
  if (ai.tick <= 0) {
    ai.tick = cfg.react * rand(0.7, 1.3);
    let danger = null;
    for (const g of gifts) {
      if (g.owner === p.side || g.dead) continue;
      const d = predictHit(g, p);
      if (d && (!danger || d.t < danger.t)) danger = d;
    }
    ai.dodging = false;
    if (danger && Math.random() < cfg.dodge) {
      ai.dodging = true;
      const l = Math.hypot(danger.vx, danger.vz) || 1;
      let px = -danger.vz / l, pz = danger.vx / l;
      if (Math.random() < 0.5) { px = -px; pz = -pz; }
      if (Math.abs(p.x + px * 3) > ARENA_X - 0.5) { px = -px; pz = -pz; }
      ai.tx = clamp(p.x + px * 3.2, -ARENA_X, ARENA_X); ai.tz = clamp(p.z + pz * 3.2, p.zMin, p.zMax);
      if (danger.t < 0.5 && Math.random() < 0.4) ai.jumpReq = true;
    } else {
      const it = items.find(i => i.z >= p.zMin - 0.5 && i.z <= p.zMax + 0.5);
      if (it) { ai.tx = it.x; ai.tz = it.z; }
      else if (Math.random() < 0.3) { ai.tx = rand(-ARENA_X + 1, ARENA_X - 1); ai.tz = rand(p.zMin + 1, p.zMax - 1); }
    }
  }
  const dx = ai.tx - p.x, dz = ai.tz - p.z, dl = Math.hypot(dx, dz);
  if (dl > 0.3) { inp.mx = dx / dl; inp.mz = dz / dl; }
  if (ai.jumpReq) { inp.jump = true; ai.jumpReq = false; }
  // 조준: 차징 중에도 매 프레임 다시 계산 (상대 이동 예측 + 난이도별 오차)
  const aimSolve = () => {
    let s = solveCharge(p, o.x, o.z, 1);
    const lx = o.x + o.vx * s.t * cfg.lead, lz = o.z + o.vz * s.t * cfg.lead;
    s = solveCharge(p, lx, lz, 1);
    const ddx = lx - p.x, ddz = lz - p.z, c = Math.cos(ai.errA), sn = Math.sin(ai.errA);
    return { c: clamp(s.c + ai.errC, 0, 1), x: p.x + ddx * c - ddz * sn, z: p.z + ddx * sn + ddz * c };
  };
  if (p.charging) {
    if (!ai.dodging) { inp.mx = 0; inp.mz = 0; }
    const a = aimSolve();
    inp.throw = p.charge < a.c; inp.tx = a.x; inp.tz = a.z;
  } else if (ai.throwT <= 0 && p.cool <= 0) {
    ai.errC = gauss() * cfg.err; ai.errA = gauss() * cfg.aim;
    const a = aimSolve();
    inp.throw = true; inp.tx = a.x; inp.tz = a.z;
    ai.throwT = rand(...cfg.interval);
  }
  return inp;
}

function update(dt, t) {

    if (snowPos[i * 3 + 1] < 0) snowPos[i * 3 + 1] = 26;
  }
  snowGeo.attributes.position.needsUpdate = true;
  for (const o of ornaments) o.m.emissiveIntensity = Math.sin(t * 3 + o.t) > -0.3 ? 1.3 : 0.1;
  topStar.rotation.y = Math.sin(t) * 0.4;
  if (state === 'matchEnd') endT += dt;
  if (paused) return;
  if (inGame()) turnAim(((keys.KeyQ ? 1 : 0) - (keys.KeyE ? 1 : 0)) * 1.8 * dt, ((keys.KeyR ? 1 : 0) - (keys.KeyF ? 1 : 0)) * 14 * dt);

  if (state === 'countdown') {

  } else if (state === 'fight') setMsg('', '');

        $('endTitle').textContent = w.side === 0 ? '🎉 승리! 🎉' : '패배... 🎄';
        $('endScore').textContent = `${players[0].wins} : ${players[1].wins}`;

  if (state === 'fight') {
    roundTime -= sdt;
    if (roundTime <= 0) { roundTime = 0; const [a, b] = players; endRound(a.hp === b.hp ? null : a.hp > b.hp ? 0 : 1, '시간 종료!'); }

  const cfg = AI_CFG[state === 'title' ? 'normal' : mode];

  // 선물

    g.vy -= G * sdt; g.x += g.vx * sdt; g.y += g.vy * sdt; g.z += g.vz * sdt;
    g.mesh.rotation.x += g.rx * sdt; g.mesh.rotation.z += g.rz * sdt;
  }
  for (let i = 0; i < gifts.length; i++) for (let j = i + 1; j < gifts.length; j++) {
    const a = gifts[i], b = gifts[j];

    if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2 < (a.r + b.r + 0.1) ** 2) {

      confetti(mx, my, mz, [a.color, b.color, 0xffffff, 0xffd54f], 26, 7);

    }

    if (g.dead) continue;
    for (const w of walls) {
      if (w.hp <= 0) continue;
      const h = wallH(w);
      if (Math.abs(g.x - w.x) < w.w / 2 + g.r && Math.abs(g.z - w.z) < w.d / 2 + g.r && g.y < h + g.r) {
        g.dead = true; w.hp = Math.max(0, w.hp - g.dmg); syncWall(w); sfx.wall();

        if (state !== 'title') popup(p.x, p.y + 2.8, p.z, '막았다!', '#b3e5fc');
      } else {

    }
    if (g.dead) continue;
    if (g.y <= g.r * 0.6) { g.dead = true; sfx.plop(); confetti(g.x, 0.1, g.z, [0xffffff, g.color], 8, 3); }

  }
  for (const g of gifts) {
    if (g.dead) { scene.remove(g.mesh); scene.remove(g.shadow); continue; }
    g.mesh.position.set(g.x, g.y, g.z);
    g.shadow.position.set(g.x, 0.02, g.z); g.shadow.scale.setScalar(g.big ? 1.6 : 1);

}
